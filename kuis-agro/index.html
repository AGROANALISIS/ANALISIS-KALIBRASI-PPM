<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuis Agroteknologi 🌱</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Verdana,system-ui,sans-serif;color:#fff;background:linear-gradient(135deg,#2a1b7a 0%,#3b3fc4 55%,#1f6fd1 100%) fixed;display:flex;justify-content:center;padding:14px}
.app{width:min(760px,100%)}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
a.back{color:#dfe6ff;text-decoration:none;font-size:14px;background:#ffffff1f;padding:6px 12px;border-radius:999px}
h1{font-size:clamp(20px,4vw,28px);margin:10px 0 2px}.sub{opacity:.8;font-size:13px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.st{background:#ffffff1c;border:2px solid #ffffff33;border-radius:14px;padding:8px;text-align:center}
.st b{display:block;font-size:22px}.st span{font-size:12px;opacity:.85}
.card{background:linear-gradient(160deg,#ffffff26,#ffffff10);border:2px solid #ffd76a88;border-radius:20px;padding:18px;box-shadow:0 14px 40px #0006}
.chip{display:inline-block;font-size:12px;background:#ffd76a;color:#3a2300;font-weight:800;border-radius:999px;padding:3px 10px}.no{float:right;font-size:12px;opacity:.8}
#q{font-size:clamp(17px,3.2vw,22px);line-height:1.4;margin:12px 0 16px;font-weight:700}
.opts{display:grid;gap:10px}.o{display:flex;gap:10px;align-items:center;text-align:left;font:inherit;font-size:clamp(14px,2.6vw,17px);color:#fff;background:#ffffff1f;border:2px solid #ffffff44;border-radius:14px;padding:12px 14px;cursor:pointer;transition:transform .12s,background .2s}
.o:hover:not(:disabled){transform:translateX(4px);background:#ffffff33}.o i{font-style:normal;font-weight:900;background:#ffd76a;color:#3a2300;border-radius:8px;min-width:28px;height:28px;display:grid;place-items:center}
.o.bad{background:#d32f2fcc;border-color:#ff8a80;animation:shake .4s}.o.ok{background:#2e9b4ecc;border-color:#9dffb0;animation:pulse .6s}.o:disabled{cursor:default}.o.bad:disabled{opacity:.75}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}@keyframes pulse{50%{transform:scale(1.04)}}
#msg{min-height:30px;margin-top:14px;font-weight:800;font-size:18px;text-align:center}.nx{display:none;margin:10px auto 0;font:inherit;font-weight:800;font-size:17px;background:linear-gradient(#ffe27a,#ffb300);color:#3a2300;border:0;border-radius:999px;padding:12px 26px;cursor:pointer;box-shadow:0 6px 0 #a56d00}.nx.on{display:block}
.tools{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}.tb{font:inherit;font-size:13px;color:#fff;background:#ffffff22;border:1px solid #fff4;border-radius:999px;padding:6px 12px;cursor:pointer}
.candy{position:fixed;top:-40px;font-size:30px;pointer-events:none;z-index:50;animation:fall linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.big{position:fixed;inset:0;display:none;place-items:center;pointer-events:none;z-index:40}.big.on{display:grid}.big div{font-size:clamp(28px,7vw,56px);font-weight:900;text-align:center;color:#ffe27a;text-shadow:0 4px 0 #7a1010,0 0 30px #ffb300;animation:pop 1.6s ease-out forwards}
@keyframes pop{0%{transform:scale(.2);opacity:0}20%{transform:scale(1.15);opacity:1}80%{opacity:1}100%{transform:scale(1) translateY(-30px);opacity:0}}

/* Mobile-first refinement + worked formula panel */
.tools{flex-wrap:wrap;justify-content:flex-end}.tb{min-height:38px;max-width:100%;font-size:12px}
.explain{margin-top:14px;padding:13px 14px;border-radius:14px;background:linear-gradient(145deg,#fff8dc,#ffe9a8);border:2px solid #ffc84b;color:#342300;text-align:left;box-shadow:0 8px 22px #120b4633}
.explain h3{margin:0 0 7px;font-size:15px;color:#754400}.explain p{margin:5px 0;font-size:14px;line-height:1.5}.explain .formula{font-weight:900;font-size:clamp(15px,3vw,19px);color:#164e35;background:#dff7e8;border-radius:9px;padding:8px 10px;overflow-wrap:anywhere}
.big .party{display:flex;align-items:center;justify-content:center;gap:clamp(12px,4vw,30px);flex-wrap:wrap}
.dancer{display:inline-block;font-size:clamp(48px,12vw,88px);filter:drop-shadow(0 7px 5px #5a160b88);animation:dance .48s ease-in-out infinite alternate;transform-origin:50% 90%}
.dancer.two{animation-delay:.24s;animation-direction:alternate-reverse}
@keyframes dance{0%{transform:translateY(4px) rotate(-16deg) scale(.94)}50%{transform:translateY(-13px) rotate(12deg) scale(1.08)}100%{transform:translateY(1px) rotate(-8deg) scale(1)}}
@media(max-width:520px){body{padding:9px}.tools{gap:5px}.tb{padding:6px 9px;font-size:11px}#vs{width:100%;max-width:none!important}.card{padding:14px}.stats{gap:6px}.st{padding:7px 4px}.st b{font-size:19px}.st span{font-size:10px}.explain p{font-size:13px}}
@media(prefers-reduced-motion:reduce){.dancer{animation:none}.candy{animation-duration:0s}}
</style></head><body><div class="app">
<div class="top"><a class="back" href="../index.html">← Beranda</a><div class="tools"><select class="tb" id="vs" title="Pilih suara Indonesia" style="max-width:210px"><option value="">Suara Indonesia otomatis</option></select><button class="tb" id="testVoice">🔈 Tes suara</button><button class="tb" id="snd">🔊 Suara: ON</button><button class="tb" id="rst">↺ Reset skor</button></div></div>
<h1>🌱 Kuis Agroteknologi</h1><div class="sub">1000 soal acak seputar pertanian & agroteknologi. Jawab benar = 1 kemenangan + 1 permen 🍬 (suara bisa diganti di pojok kanan atas)</div>
<div class="stats"><div class="st"><b id="w">0</b><span>🏆 Kemenangan</span></div><div class="st"><b id="c">0</b><span>🍬 Permen</span></div><div class="st"><b id="n">0</b><span>❓ Soal dijawab benar dari 1000</span></div></div>
<div class="card"><span class="chip" id="tp"></span><span class="no" id="no"></span><div id="q"></div><div class="opts" id="opts"></div><div id="msg"></div><section id="explain" class="explain" hidden></section><button class="nx" id="nx">Soal berikutnya ➜</button></div>
</div><div class="big" id="big"><div></div></div>
<script src="questions.js"></script>
<script>
const $=id=>document.getElementById(id),K='agroquiz_v1';let S={w:0,c:0,seen:[]},order=[],pos=0,cur=null,lock=false,sound=true;
try{S=Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newOrder(){const done=new Set(S.seen);let r=QUIZ.map((_,i)=>i).filter(i=>!done.has(QUIZ[i].id));if(!r.length){S.seen=[];save();r=QUIZ.map((_,i)=>i)}order=shuffle(r);pos=0}
function stats(){$('w').textContent=S.w;$('c').textContent=S.c;$('n').textContent=S.seen.length}
/* suara: ucapan (Web Speech) + efek bunyi */
let ac;function beep(f,d,t,v){if(!sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=v||.15;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
/* ---- suara Bahasa Indonesia untuk ponsel ---- */
let VOX=[],pref=null,voiceReady=false,speechBusy=false;
try{pref=localStorage.getItem('agroquiz_voice')}catch(e){}
const FEM=/gadis|female|perempuan|wanita|damayanti|samantha|karen|susan|zira|natural|neural/i;
function voiceScore(v){let n=0;if(/^id[-_]/i.test(v.lang))n+=100;if(FEM.test(v.name))n+=25;if(/online|natural|neural/i.test(v.name))n+=8;return n}
function loadVox(){if(!window.speechSynthesis)return;VOX=speechSynthesis.getVoices().filter(v=>/^id([-_]|$)/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a));voiceReady=true;const sel=$('vs');if(!sel)return;sel.innerHTML='<option value="">Suara Indonesia otomatis</option>'+VOX.map(v=>'<option value="'+v.name.replace(/"/g,'&quot;')+'">'+v.name+' ('+v.lang+')</option>').join('');if(pref&&VOX.some(v=>v.name===pref))sel.value=pref;else pref=null;}
function bestVoice(){if(pref){const chosen=VOX.find(v=>v.name===pref);if(chosen)return chosen}return VOX[0]||null}
function refreshVoices(){if(!window.speechSynthesis)return;loadVox();setTimeout(loadVox,350);setTimeout(loadVox,1100)}
function say(t,o={}){return new Promise(resolve=>{
 if(!sound||!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){resolve(false);return}
 try{const synth=window.speechSynthesis;refreshVoices();synth.cancel();const u=new SpeechSynthesisUtterance(t),v=bestVoice();u.lang='id-ID';if(v)u.voice=v;u.rate=o.r??.96;u.pitch=o.p??1.04;u.volume=1;let settled=false;const done=ok=>{if(settled)return;settled=true;speechBusy=false;resolve(ok)};u.onend=()=>done(true);u.onerror=()=>done(false);speechBusy=true;synth.speak(u);/* Android can occasionally leave the queue paused */setTimeout(()=>{try{if(speechBusy&&synth.paused)synth.resume()}catch(e){}},250)}catch(e){speechBusy=false;resolve(false)}
 })}
function sayWin(){say('Selamat! Kamu mendapatkan permen!',{r:.94,p:1.06})}
function sayBad(){say('Belum tepat. Silakan coba lagi.',{r:.96,p:1.02})}
function candies(){const E=['🍬','🍭','🍫','🍬','🍭'];for(let i=0;i<34;i++){const e=document.createElement('div');e.className='candy';e.textContent=E[i%5];e.style.left=Math.random()*100+'vw';e.style.animationDuration=(1.8+Math.random()*1.8)+'s';e.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),4500)}}
function banner(t){const b=$('big');b.firstChild.innerHTML=t;b.classList.remove('on');void b.offsetWidth;b.classList.add('on');setTimeout(()=>b.classList.remove('on'),1700)}
function show(){if(pos>=order.length)newOrder();cur=QUIZ[order[pos]];lock=false;$('tp').textContent=cur.t;$('no').textContent='Soal #'+cur.id;$('q').textContent=cur.q;$('msg').textContent='';$('explain').hidden=true;$('explain').innerHTML='';$('nx').classList.remove('on');
 $('opts').innerHTML='';cur.o.forEach((o,i)=>{const b=document.createElement('button');b.className='o';b.innerHTML='<i>'+'ABCD'[i]+'</i><span></span>';b.lastChild.textContent=o;b.onclick=()=>pickOpt(i,b);$('opts').appendChild(b)})}
function numID(x){if(x==null)return NaN;let z=String(x).trim().replace(/\s/g,'');if(z.includes(','))z=z.replace(/\./g,'').replace(',','.');else z=z.replace(/\./g,'');return Number(z)}
function fmtID(x){return Number.isInteger(x)?x.toLocaleString('id-ID'):x.toLocaleString('id-ID',{maximumFractionDigits:2})}
function formulaFor(q){
 const txt=q.replace(/\s+/g,' ');let m,a,b,c,d;
 if((m=txt.match(/Dari ([\d.,]+) butir benih yang diuji, ([\d.,]+) butir berkecambah normal/i))){a=numID(m[1]);b=numID(m[2]);return {name:'Daya kecambah',f:'(Jumlah benih berkecambah normal ÷ jumlah benih diuji) × 100%',step:`(${fmtID(b)} ÷ ${fmtID(a)}) × 100% = ${fmtID(b/a*100)}%`}}
 if((m=txt.match(/Gabah basah ([\d.,]+) kg berkadar air ([\d.,]+)%.*massa bahan kering/i))){a=numID(m[1]);b=numID(m[2]);return {name:'Massa bahan kering',f:'Berat awal × (100% − kadar air) ÷ 100%',step:`${fmtID(a)} × (100 − ${fmtID(b)}) ÷ 100 = ${fmtID(a*(100-b)/100)} kg`}}
 if((m=txt.match(/Gabah basah ([\d.,]+) kg berkadar air ([\d.,]+)%.*massa air/i))){a=numID(m[1]);b=numID(m[2]);return {name:'Massa air',f:'Berat awal × kadar air ÷ 100%',step:`${fmtID(a)} × ${fmtID(b)} ÷ 100 = ${fmtID(a*b/100)} kg`}}
 if((m=txt.match(/(?:Dosis|Kebutuhan) (?:urea|pupuk cair|benih) ([\d.,]+)\s*(kg|ml) per (?:hektar|liter air).*?(?:lahan\s+|untuk\s+(?:lahan\s+)?)([\d.,]+)\s*(hektar|liter)/i))){a=numID(m[1]);b=numID(m[3]);return {name:'Menghitung kebutuhan pupuk',f:'Dosis per satuan × luas lahan / volume air',step:`${fmtID(a)} ${m[2]} × ${fmtID(b)} = ${fmtID(a*b)} ${m[2]}`}}
 if((m=txt.match(/Dosis pupuk cair ([\d.,]+) ml per liter air.*?([\d.,]+) liter air/i))){a=numID(m[1]);b=numID(m[2]);return {name:'Kebutuhan pupuk cair',f:'Dosis (ml/L) × volume air (L)',step:`${fmtID(a)} × ${fmtID(b)} = ${fmtID(a*b)} ml`}}
 if((m=txt.match(/Panen ([\d.,]+) kg dijual Rp([\d.,]+) per kg, sedangkan biaya produksi Rp([\d.,]+)/i))){a=numID(m[1]);b=numID(m[2]);c=numID(m[3]);return {name:'Keuntungan usaha tani',f:'(Hasil panen × harga jual per kg) − biaya produksi',step:`(${fmtID(a)} × Rp${fmtID(b)}) − Rp${fmtID(c)} = Rp${fmtID(a*b-c)}`}}
 if((m=txt.match(/jarak tanam ([\d.,]+) × ([\d.,]+) cm/i)) && (d=txt.match(/Lahan ([\d.,]+) m²/i))){a=numID(d[1]);b=numID(m[1])/100;c=numID(m[2])/100;return {name:'Populasi tanaman',f:'Luas lahan ÷ (jarak antarbaris × jarak dalam baris)',step:`${fmtID(a)} ÷ (${fmtID(b)} × ${fmtID(c)}) = ${fmtID(a/(b*c))} tanaman`}}
 if((m=txt.match(/([\d.,]+) (ton|kuintal) sama dengan berapa kg/i))){a=numID(m[1]);b=m[2].toLowerCase()==='ton'?1000:100;return {name:'Konversi satuan massa',f:m[2].toLowerCase()==='ton'?'1 ton = 1.000 kg':'1 kuintal = 100 kg',step:`${fmtID(a)} × ${fmtID(b)} = ${fmtID(a*b)} kg`}}
 if((m=txt.match(/([\d.,]+) hektar sama dengan berapa m²/i))){a=numID(m[1]);return {name:'Konversi luas lahan',f:'1 hektar = 10.000 m²',step:`${fmtID(a)} × 10.000 = ${fmtID(a*10000)} m²`}}
 if((m=txt.match(/Sebanyak ([\d.,]+) ton tebu memiliki rendemen ([\d.,]+)%/i))){a=numID(m[1]);b=numID(m[2]);return {name:'Hasil gula dari rendemen tebu',f:'Berat tebu × rendemen ÷ 100%',step:`${fmtID(a)} × ${fmtID(b)} ÷ 100 = ${fmtID(a*b/100)} ton gula`}}
 if((m=txt.match(/Sebidang lahan berukuran ([\d.,]+) m × ([\d.,]+) m/i))){a=numID(m[1]);b=numID(m[2]);return {name:'Luas lahan berbentuk persegi panjang',f:'Panjang × lebar; 1 hektar = 10.000 m²',step:`${fmtID(a)} × ${fmtID(b)} = ${fmtID(a*b)} m² = ${fmtID(a*b/10000)} hektar`}}
 if((m=txt.match(/Produktivitas lahan ([\d.,]+) ton per hektar.*?dari ([\d.,]+) hektar/i))){a=numID(m[1]);b=numID(m[2]);return {name:'Total hasil panen',f:'Produktivitas per hektar × luas lahan',step:`${fmtID(a)} × ${fmtID(b)} = ${fmtID(a*b)} ton`}}
 if((m=txt.match(/memerlukan ([\d.,]+) ml AB mix A dan ([\d.,]+) ml B per liter.*?untuk ([\d.,]+) liter/i))){a=numID(m[1]);b=numID(m[2]);c=numID(m[3]);return {name:'Kebutuhan larutan AB mix',f:'(Dosis AB mix A + dosis AB mix B) × volume air',step:`(${fmtID(a)} + ${fmtID(b)}) × ${fmtID(c)} = ${fmtID((a+b)*c)} ml`}}
 if((m=txt.match(/Debit air irigasi ([\d.,]+) liter per menit mengalir selama ([\d.,]+) menit/i))){a=numID(m[1]);b=numID(m[2]);return {name:'Volume air irigasi',f:'Debit air × waktu aliran',step:`${fmtID(a)} × ${fmtID(b)} = ${fmtID(a*b)} liter`}}
 return {name:'Langkah perhitungan',f:'Tentukan data yang diketahui, pilih rumus yang sesuai, lalu masukkan nilai dan hitung satuannya.',step:'Periksa kembali angka, satuan, dan hasil akhir.'};
}
function showFormula(){if(!cur||cur.t!=='Hitungan pertanian')return;const x=formulaFor(cur.q),el=$('explain');el.innerHTML=`<h3>📐 Rumus & cara menghitung: ${x.name}</h3><p><b>Rumus:</b></p><p class="formula">${x.f}</p><p><b>Substitusi:</b> ${x.step}</p>`;el.hidden=false}
function pickOpt(i,b){if(lock||b.disabled)return;
 if(i===cur.a){lock=true;b.classList.add('ok');[...$('opts').children].forEach(x=>x.disabled=true);S.w++;S.c++;if(!S.seen.includes(cur.id))S.seen.push(cur.id);save();stats();
  $('msg').innerHTML='🎉 Benar! +1 kemenangan, +1 permen 🍬';showFormula();banner('<div class="party"><span class="dancer">💃</span><span>🎉 BENAR!<br>Permen untukmu 🍬</span><span class="dancer two">🕺</span></div>');candies();beep(660,.15,'triangle');setTimeout(()=>beep(880,.15,'triangle'),130);setTimeout(()=>beep(1175,.3,'triangle'),270);sayWin();$('nx').classList.add('on');pos++;$('nx').focus()}
 else{b.classList.add('bad');b.disabled=true;$('msg').textContent='❌ Belum tepat. Silakan coba lagi!';beep(180,.35,'sawtooth',.12);sayBad()}}
$('nx').onclick=show;$('snd').onclick=()=>{sound=!sound;$('snd').textContent='🔊 Suara: '+(sound?'ON':'OFF');if(!sound&&window.speechSynthesis)speechSynthesis.cancel()};$('testVoice').onclick=()=>{sound=true;$('snd').textContent='🔊 Suara: ON';refreshVoices();say('Halo! Ini suara Bahasa Indonesia. Selamat, kamu mendapatkan permen!',{r:.95,p:1.05})};
$('rst').onclick=()=>{if(confirm('Reset kemenangan dan permen?')){S={w:0,c:0,seen:[]};save();stats();newOrder();show()}};
addEventListener('keydown',e=>{const k='abcd1234'.indexOf(e.key.toLowerCase());if(k>=0&&!lock){const i=k%4,b=$('opts').children[i];b&&pickOpt(i,b)}else if((e.key==='Enter'||e.key===' ')&&$('nx').classList.contains('on')){e.preventDefault();show()}});
if(window.speechSynthesis){refreshVoices();speechSynthesis.onvoiceschanged=refreshVoices} $('vs').onchange=e=>{pref=e.target.value||null;try{pref?localStorage.setItem('agroquiz_voice',pref):localStorage.removeItem('agroquiz_voice')}catch(_){}say('Halo! Ini contoh suara Bahasa Indonesia.',{r:.96,p:1.04})};stats();newOrder();show();
</script></body></html>
