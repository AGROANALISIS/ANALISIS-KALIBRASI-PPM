<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monopoli Nusantara</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#f5ecd6;font:20px VT323,Verdana,sans-serif;background:radial-gradient(ellipse at 50% -10%,#5a3c1c,#1a1020 60%,#07050a)}
h1{font:14px 'Press Start 2P',monospace;margin:0;color:#ffd76a;text-shadow:2px 2px #000}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:8px;flex-wrap:wrap}
.top a{color:#ffd76a;text-decoration:none;border:2px solid #ffd76a;padding:4px 10px;border-radius:8px}
button{font:inherit;font-size:22px;background:linear-gradient(#ffd76a,#d49a1c);color:#2b1700;border:0;border-radius:10px;padding:6px 16px;cursor:pointer;box-shadow:0 4px 0 #7a4f00;margin:3px}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #7a4f00}
.wrap{display:flex;gap:14px;justify-content:center;align-items:flex-start;flex-wrap:wrap;padding:0 10px 90px}
.top{padding:4px 14px}
.act{position:sticky;top:6px;z-index:6;background:#2a1c10!important;border-color:#ffd76a!important}
@media(max-width:1000px){.act{position:fixed;left:6px;right:6px;bottom:6px;top:auto;margin:0;z-index:20}#log{height:90px}}
.stage{position:relative;overflow:hidden;container-type:inline-size;width:min(96vw,calc(100dvh - 70px),820px);flex:none;border-radius:18px;touch-action:manipulation}
.board{container-type:inline-size;width:100%;aspect-ratio:1;display:grid;grid-template:1.45fr repeat(9,1fr) 1.45fr/1.45fr repeat(9,1fr) 1.45fr;gap:2px;padding:10px;border-radius:18px;background:linear-gradient(135deg,#8a6a2c,#3a2a10 40%,#a98a3c);box-shadow:0 40px 60px #000a,inset 0 0 0 3px #ffd76a66;transform:rotateX(16deg) scale(.93);transform-origin:50% 60%}
.tl{position:relative;background:linear-gradient(#f7edd0,#e4d4a6);color:#2a1f0a;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:1.9cqw;line-height:1;overflow:hidden;cursor:pointer;border:1px solid #8a6a2c}
.tl b{font-weight:400;padding:0 2px}.tl em{font-style:normal;font-size:1.6cqw;opacity:.75;margin-top:2px}
.bd{position:absolute;background:#999}
.s-b .bd{left:0;right:0;top:0;height:22%}.s-t .bd{left:0;right:0;bottom:0;height:22%}
.s-l .bd{top:0;bottom:0;right:0;width:22%}.s-r .bd{top:0;bottom:0;left:0;width:22%}
.s-b b,.s-b em{margin-top:10%}.s-t{padding-bottom:8%}
.tl .ic{font-size:4.4cqw;line-height:1.1;filter:drop-shadow(0 .2cqw .2cqw #0006)}.tl .ic.big{font-size:6.4cqw}
.fx{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);font:3.2cqw 'Press Start 2P';white-space:nowrap;text-shadow:.3cqw .3cqw #000;z-index:15;pointer-events:none;text-align:center;max-width:94%}
.tk{position:absolute;bottom:1px;left:0;right:0;display:flex;justify-content:center;flex-wrap:wrap;gap:1px;z-index:3}
.pt{width:3.4cqw;height:3.4cqw;border-radius:50%;display:grid;place-items:center;font-size:2.4cqw;border:1px solid #000;box-shadow:0 2px 3px #0008;background:var(--c)}
.hs{position:absolute;display:flex;align-items:flex-end;justify-content:center;gap:.15cqw;z-index:3;pointer-events:none}
.ctr{grid-area:2/2/11/11;border-radius:12px;background:radial-gradient(circle at 50% 40%,#3d3340,#15101a);box-shadow:inset 0 0 40px #000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqw;position:relative}
.ban{font:900 5.4cqw 'Press Start 2P',monospace;background:linear-gradient(#e53935,#9d1111);padding:1.4cqw 3cqw;border:.4cqw solid #fff;color:#fff;text-shadow:.3cqw .3cqw #000;transform:rotate(-4deg);box-shadow:0 1cqw 2cqw #000a}
.mas{font-size:12cqw;filter:drop-shadow(0 1cqw 1cqw #000)}
.decks{display:flex;gap:6cqw}.dk{width:14cqw;height:9cqw;border-radius:1cqw;display:grid;place-items:center;font:1.7cqw 'Press Start 2P';color:#fff;transform:rotate(-6deg);box-shadow:.5cqw .5cqw 0 #0008}
.dice{display:flex;gap:2cqw;font-size:10cqw;line-height:1;color:#fff}.dice span.r{animation:sh .12s infinite}
@keyframes sh{50%{transform:rotate(25deg) translateY(-6px)}}
.panel{width:min(96vw,330px);display:flex;flex-direction:column;gap:8px}
.card{background:#ffffff12;border:2px solid #ffd76a55;border-radius:12px;padding:8px 10px}
.pl{display:flex;align-items:center;gap:8px;padding:4px;border-radius:8px}.pl.on{background:#ffd76a33;outline:2px solid #ffd76a}.pl.out{opacity:.35;text-decoration:line-through}
#log{height:150px;overflow:auto;font-size:18px;color:#cfc3a0}#msg{min-height:60px;font-size:22px}
dialog,.setup{position:fixed;inset:0;background:#000c;display:grid;place-items:center;z-index:9}
.box{background:#2a1c10;border:3px solid #ffd76a;border-radius:16px;padding:18px;max-width:92vw;text-align:center}
select{font:inherit;font-size:20px;margin-left:6px}

.seg{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:8px 0}.seg button{font-size:18px;padding:5px 10px;opacity:.6}.seg button.on{opacity:1;outline:3px solid #fff}
.box{max-height:94vh;overflow:auto;width:min(94vw,470px)}.box input{font:inherit;font-size:24px;width:110px;text-align:center;text-transform:uppercase}
.slot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0;padding:3px 8px;border-radius:8px;background:#ffffff12}
#info{min-height:26px;margin:6px 0;color:#ffe9a8}.code{font:18px 'Press Start 2P',monospace;color:#7CFC7C;letter-spacing:4px}
#rb{font-size:17px;border:2px solid #7CFC7C;color:#7CFC7C;padding:3px 8px;border-radius:8px;display:none}

.cam{width:100%;transform-origin:0 0;transition:transform 1.1s cubic-bezier(.45,0,.2,1);perspective:1500px;position:relative}
.board{transition:transform 1.1s cubic-bezier(.45,0,.2,1)}
.stage.zin .board{transform:none!important}
.s-b .hs{left:0;right:0;top:0;height:22%}.s-t .hs{left:0;right:0;bottom:0;height:22%}
.s-l .hs{top:0;bottom:0;right:0;width:22%;flex-direction:column;justify-content:center;align-items:center}.s-r .hs{top:0;bottom:0;left:0;width:22%;flex-direction:column;justify-content:center;align-items:center}
.hs svg{height:100%;width:auto;max-width:24%;filter:drop-shadow(0 .15cqw .15cqw #0008)}
.s-l .hs svg,.s-r .hs svg{width:100%;height:auto;max-height:24%;max-width:none}
.tk{z-index:5}
.tl.pk{outline:.6cqw dashed #7CFC7C;outline-offset:-.6cqw;animation:pkb .8s infinite alternate}@keyframes pkb{to{filter:brightness(1.35)}}
.tl.jailed::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 16%,#1b1b1bcc 16% 24%);z-index:4;pointer-events:none}
#scene{position:absolute;left:0;right:0;bottom:0;z-index:12;pointer-events:none;transform:translateY(120%);transition:transform .7s cubic-bezier(.2,1.15,.3,1)}
#scene.on{transform:none}
.sc{margin:0 3cqw 2cqw;border:.7cqw solid #ffd76a;border-radius:3cqw;overflow:hidden;box-shadow:0 1.5cqw 5cqw #000c;background:#101826;color:#fff;position:relative}
.sc:before{content:'';position:absolute;left:0;right:0;top:0;height:1.6cqw;background:var(--c1);z-index:2}
.sky{position:relative;height:12.5cqw;background:linear-gradient(#6ec6ff,#d7f1ff 85%);overflow:hidden}
.sc.bars .sky{background:linear-gradient(#3a3f55,#8a8fa5 85%)}.sc.road .sky{background:linear-gradient(#ffb36b,#ffe3b0 85%)}.sc.rail .sky{background:linear-gradient(#8ec9ff,#e6f6ff 85%)}
.sky .sun{position:absolute;right:4cqw;top:1.6cqw;font-size:4.6cqw}.sky .cl{position:absolute;left:6cqw;top:2.4cqw;font-size:4cqw;opacity:.9;animation:drift 12s linear infinite alternate}
.sky .lms{position:absolute;left:0;right:0;bottom:-.4cqw;display:flex;justify-content:center;font-size:9.6cqw;line-height:1;filter:drop-shadow(0 .6cqw .4cqw #0005);animation:bob 3s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-1cqw)}}@keyframes drift{to{transform:translateX(14cqw)}}
.gr{position:relative;height:10.5cqw;background:linear-gradient(#6fcf5c,#3f9d3b);display:flex;align-items:flex-end;justify-content:center;gap:.8cqw;padding:0 3cqw .8cqw}
.sc.bars .gr{background:linear-gradient(#777,#444)}.sc.road .gr{background:linear-gradient(#666,#3a3a3a)}.sc.rail .gr{background:linear-gradient(#a48b62,#6b5a3a)}
.gr .tr{font-size:6cqw;line-height:1}.gr .tr.sm{font-size:3.6cqw}.gr .sign{font-size:6.4cqw;line-height:1}
.gr .hz{height:7.4cqw;display:flex;align-items:flex-end}.gr .hz.hotel{height:9.6cqw}.gr .hz svg{height:100%;width:auto;filter:drop-shadow(0 .5cqw .3cqw #0007)}
.gr .hz.new{animation:drop .95s cubic-bezier(.3,1.4,.5,1)}@keyframes drop{from{transform:translateY(-38cqw) scale(1.5);opacity:0}55%{opacity:1}to{transform:none}}
.inf{padding:1.2cqw 3cqw 1.6cqw;background:#1b1220;font-size:3.2cqw;line-height:1.3;text-align:center}
.inf b{color:#ffd76a}.inf>b:first-child{font:2.5cqw 'Press Start 2P',monospace;display:block;margin-bottom:.5cqw}.inf small{opacity:.85;font-size:3cqw}
.tb{height:7px;background:#0007;border-radius:4px;margin-top:6px;display:none;overflow:hidden}.tb i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff7b7b,#ffd76a,#7CFC7C);border-radius:4px}
.pol{position:absolute;width:0;height:0;z-index:30;pointer-events:none}
.pol .siren{position:absolute;width:34cqw;height:34cqw;border-radius:50%;transform:translate(-50%,-50%);animation:sir .3s infinite alternate}
@keyframes sir{from{background:radial-gradient(#ff2a2acc,transparent 65%)}to{background:radial-gradient(#2a4bffcc,transparent 65%)}}
.pol .pcar{position:absolute;font-size:8cqw;line-height:1;transform:translate(-50%,-50%);animation:pdrive 1.2s ease-out forwards}@keyframes pdrive{from{left:-70cqw}to{left:7cqw}}
.pol .pcop{position:absolute;font-size:7cqw;line-height:1;transform:translate(-110%,-50%) scale(0);animation:pcop .45s 1s ease-out forwards}@keyframes pcop{to{transform:translate(-120%,-45%) scale(1)}}
.pol .pcuf{position:absolute;font-size:5cqw;line-height:1;transform:translate(-50%,-50%) scale(0);animation:pcuf .4s 1.5s ease-out forwards}@keyframes pcuf{to{transform:translate(-50%,-50%) scale(1) rotate(-12deg)}}
.pol .ptxt{position:absolute;white-space:nowrap;font:2.6cqw 'Press Start 2P',monospace;color:#fff;background:#c0111a;padding:.9cqw 1.6cqw;border:.3cqw solid #fff;transform:translate(-50%,260%) rotate(-3deg) scale(0);animation:ptx .35s 1.2s ease-out forwards}@keyframes ptx{to{transform:translate(-50%,260%) rotate(-3deg) scale(1)}}
/* ===== overlay kartu & sertifikat ===== */
.ov{position:absolute;inset:0;z-index:40;display:grid;place-items:center;pointer-events:none;background:radial-gradient(#000a,#000d);opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s;overflow:hidden}
.ov.on{opacity:1;visibility:visible;transition:opacity .35s}
.pr{position:absolute;top:-8%;left:var(--x);font-size:var(--s);font-style:normal;opacity:0;animation:fall var(--d) linear var(--dl) forwards;z-index:3}
.pr.up{top:auto;bottom:-8%;animation-name:rise}
@keyframes fall{0%{opacity:0;transform:translateY(0) rotate(0)}10%{opacity:1}to{opacity:1;transform:translateY(112cqw) rotate(360deg)}}
@keyframes rise{0%{opacity:0;transform:translateY(0) rotate(0)}10%{opacity:1}to{opacity:0;transform:translateY(-100cqw) rotate(-200deg)}}
.cd{position:relative;width:44cqw;height:60cqw;perspective:160cqw;animation:cdin .8s cubic-bezier(.2,1.1,.3,1) both;z-index:2}
@keyframes cdin{from{transform:translate(40cqw,50cqw) scale(.25) rotate(25deg);opacity:0}to{transform:none;opacity:1}}
.cdi{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(180deg);animation:cflip .9s .75s cubic-bezier(.3,1.3,.4,1) forwards}
@keyframes cflip{to{transform:rotateY(0)}}
.cdf{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:3cqw;border:.9cqw solid #fff;box-shadow:0 2cqw 6cqw #000c,inset 0 0 0 .5cqw #0004;overflow:hidden}
.cbk{transform:rotateY(180deg);background:repeating-linear-gradient(45deg,var(--c1) 0 3cqw,var(--c2) 3cqw 6cqw);display:grid;place-items:center;align-content:center;gap:2cqw;text-align:center}
.cbk .cbi{font-size:16cqw;filter:drop-shadow(0 1cqw 1cqw #0008);animation:cdbob .6s ease-in-out infinite alternate}
@keyframes cdbob{to{transform:translateY(-1.4cqw) scale(1.06)}}
.cbk b{font:2.8cqw 'Press Start 2P',monospace;color:#fff;text-shadow:.3cqw .3cqw #000;background:#0006;padding:1cqw 1.6cqw;border-radius:1cqw}
.cfr{background:linear-gradient(#fffdf2,#f4e8c4);color:#2a1f0a;display:flex;flex-direction:column;align-items:center;text-align:center}
.chd{width:100%;background:linear-gradient(var(--c2),var(--c1));color:#fff;font:2.6cqw 'Press Start 2P',monospace;padding:2cqw 0;text-shadow:.25cqw .25cqw #000}
.cic{font-size:17cqw;line-height:1.1;margin:3cqw 0 1cqw;position:relative;z-index:2;animation:cbn 1s 1.5s ease-in-out infinite alternate;filter:drop-shadow(0 1cqw .8cqw #0007)}
@keyframes cbn{to{transform:translateY(-1.6cqw) scale(1.1)}}
.k-loss .cic{animation:cshk .12s 1.5s 14 alternate}@keyframes cshk{from{transform:translateX(-1cqw) rotate(-6deg)}to{transform:translateX(1cqw) rotate(6deg)}}
.k-gain .cic{animation:cspin 1.2s 1.5s ease-in-out infinite}@keyframes cspin{50%{transform:rotateY(180deg) scale(1.15)}}
.k-go .cic{animation:cwave .7s 1.5s ease-in-out infinite alternate;transform-origin:50% 90%}@keyframes cwave{from{transform:rotate(-14deg)}to{transform:rotate(14deg) scale(1.1)}}
.k-jail .cic{animation:csir .3s 1.5s infinite alternate}@keyframes csir{from{filter:drop-shadow(0 0 3cqw #f33)}to{filter:drop-shadow(0 0 3cqw #36f)}}
.k-party .cic{animation:cprt .5s 1.5s ease-in-out infinite alternate}@keyframes cprt{from{transform:rotate(-18deg) scale(1)}to{transform:rotate(18deg) scale(1.2)}}
.k-back .cic{animation:cbk .8s 1.5s ease-in infinite}@keyframes cbk{from{transform:translateX(5cqw);opacity:0}30%{opacity:1}to{transform:translateX(-5cqw);opacity:0}}
.ctx{font-size:max(11px,3.5cqw);line-height:1.15;padding:0 3cqw;min-height:12cqw;display:grid;place-items:center}
.cam{margin-top:1cqw;font:3.4cqw 'Press Start 2P',monospace;padding:1.2cqw 2.2cqw;border-radius:1.5cqw;border:.4cqw solid #000;color:#fff;animation:camp .5s 1.9s cubic-bezier(.2,1.6,.4,1) both}
.cam.pos{background:#16a34a}.cam.neg{background:#dc2626}.cam.neu{background:#7c3aed}
@keyframes camp{from{transform:scale(0)}to{transform:scale(1)}}
.cpl{margin-top:auto;font-size:max(10px,2.6cqw);opacity:.7;padding-bottom:1.6cqw}
/* sertifikat */
.dd{position:relative;width:58cqw;background:linear-gradient(135deg,#fff8dc,#f3e3ad 60%,#ead595);border:.9cqw double #8a6a2c;border-radius:1.6cqw;box-shadow:0 2cqw 7cqw #000d;color:#2a1f0a;text-align:center;animation:ddin .75s cubic-bezier(.2,1.15,.3,1) both,ddsh .3s 1.35s;z-index:2}
@keyframes ddin{from{transform:translateY(70cqw) rotate(9deg) scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes ddsh{25%{transform:translate(.8cqw,.6cqw)}60%{transform:translate(-.8cqw,-.4cqw)}}
.ddh{color:#fff;padding:1.6cqw 1cqw;text-shadow:.25cqw .25cqw #000}
.ddh small{display:block;font:2.1cqw 'Press Start 2P',monospace;opacity:.95;margin-bottom:1cqw}.ddh b{font:3.6cqw 'Press Start 2P',monospace;font-weight:400}
.ddb{padding:1.2cqw 2.4cqw 1.6cqw}
.ddl{font-size:9cqw;line-height:1;animation:cbn 1.2s infinite alternate}
.dds{font-size:max(10px,2.9cqw);opacity:.8;margin-bottom:.8cqw}
.ddhs{height:6.4cqw;display:flex;justify-content:center;align-items:flex-end;gap:.5cqw;margin:.4cqw 0 1cqw}.ddhs svg{height:100%;width:auto;animation:ddhp .6s .9s cubic-bezier(.3,1.6,.5,1) both}@keyframes ddhp{from{transform:translateY(-12cqw) scale(1.8);opacity:0}}
.dd table{width:100%;border-collapse:collapse;font-size:max(10px,2.8cqw)}
.dd td{padding:.35cqw 1cqw;border-bottom:.2cqw dotted #8a6a2c88}.dd td:last-child{text-align:right;font-weight:700}
.dd tr.hl{background:#ffd76a;box-shadow:inset 0 0 0 .3cqw #c0111a}
.ddf{font-size:max(10px,2.9cqw);margin-top:1cqw}.ddo{font-size:max(11px,3.1cqw);margin-top:.6cqw}
.seal{position:absolute;left:3cqw;bottom:3cqw;font-size:8cqw;animation:sealp 1.6s 1.6s ease-in-out infinite alternate;filter:drop-shadow(0 .5cqw .4cqw #0006)}@keyframes sealp{to{transform:rotate(14deg) scale(1.12)}}
.stp{position:absolute;right:2.5cqw;bottom:6cqw;font:3.4cqw 'Press Start 2P',monospace;color:#c0111a;border:.7cqw solid #c0111a;padding:1cqw 1.5cqw;border-radius:1cqw;background:#fff9;transform:rotate(-14deg) scale(3.4);opacity:0;animation:stamp .45s 1.1s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes stamp{to{transform:rotate(-14deg) scale(1);opacity:.95}}
/* mobil parkir bebas */
.car{position:absolute;left:0;top:0;width:9.5cqw;height:4.8cqw;margin:-2.4cqw 0 0 -4.75cqw;z-index:31;pointer-events:none;filter:drop-shadow(0 .7cqw .5cqw #000b)}
.car svg{width:100%;height:100%;overflow:visible}
.car.idle{animation:idl .22s infinite alternate}@keyframes idl{to{margin-top:-2.15cqw}}
.car .pf{position:absolute;left:-.5cqw;top:50%;width:1.7cqw;height:1.7cqw;margin-top:-.85cqw;border-radius:50%;background:#fffd;animation:puff .55s linear infinite}
@keyframes puff{from{transform:translateX(0) scale(.5);opacity:.9}to{transform:translateX(-5cqw) scale(2.2);opacity:0}}
.ctag{position:absolute;left:0;top:0;width:4.4cqw;height:4.4cqw;margin:-7.2cqw 0 0 -2.2cqw;z-index:32;pointer-events:none;border-radius:50%;background:var(--c);border:.3cqw solid #fff;display:grid;place-items:center;font-size:2.8cqw;box-shadow:0 .4cqw .6cqw #0008}

@media(max-width:700px){
 body{font-size:18px}.top{padding:6px 8px}h1{font-size:10px}.top a{padding:3px 8px;font-size:17px}
 .wrap{padding:0 6px 160px;gap:8px}.stage{width:calc(100vw - 12px);border-radius:12px}
 .board{padding:5px;gap:1px;border-radius:12px;transform:rotateX(9deg) scale(.95)}
 .panel{width:calc(100vw - 12px)}button{min-height:42px;font-size:19px;padding:5px 12px}
 .act{padding:6px 8px}#msg{min-height:36px;font-size:19px}#btns{max-height:34vh;overflow:auto}
 .tl{font-size:2.5cqw}.tl em{font-size:2.1cqw}
 .inf{font-size:4cqw}.inf small{font-size:3.6cqw}.inf>b:first-child{font-size:3cqw}.sky{height:14cqw}.gr{height:12cqw}.gr .hz{height:8.6cqw}
 .box{padding:12px}.seg button{font-size:16px}.slot{font-size:18px}
}
@media(orientation:landscape) and (max-height:520px){
 .wrap{flex-wrap:nowrap;padding:0 8px 8px;align-items:flex-start}.stage{width:calc(100dvh - 54px)}
 .panel{width:auto;flex:1;min-width:0;max-height:calc(100dvh - 54px);overflow:auto}
 .act{position:sticky;left:auto;right:auto;bottom:auto;top:0;margin:0}.board{padding:6px}
 .top{padding:3px 8px}#log{height:80px}
}

/* ===== SKIN NUSANTARA: bingkai emas, bidak piksel 3D ===== */
body{background:radial-gradient(ellipse at 50% -10%,#7a1f1f,#2a0f14 55%,#0b0508)}
.top{background:linear-gradient(#e53935 0 50%,#fff 50% 100%) top/100% 6px no-repeat;padding-top:10px}
h1{color:#ffd76a;text-shadow:0 2px 0 #7a1f1f,0 0 12px #f5a52488}

function showRb(){const r=$('rb');r.style.display='inline-block';r.textContent='Ruang '+NET.code}
function onHost(m){switch(m.t){
 case 'welcome':NET.joined=true;mySlot=m.slot;$('joinBox').style.display='none';setInfo('✅ Terhubung ke ruang <b>'+NET.code+'</b>. Menunggu host memulai…');SND.join();renderSetup();break;
 case 'full':NET.joined=false;setInfo('Ruang penuh atau permainan sudah dimulai.');break;
 case 'lobby':NET.lobby=m.slots;renderSetup();break;
 case 'start':started=true;me=m.you;$('setup').style.display='none';showRb();if(SFX.mus)SFX.onMusic();break;
 case 'state':P=m.P;own=m.own;cur=m.cur;draw();break;
 case 'log':addLog(m.s);break;
 case 'msg':$('msg').textContent=m.s;break;
 case 'prompt':guestPick=!!m.pick&&m.pl===me;markPick(guestPick);barL(m.tmo||0);paint(m.msg,m.opts,m.pl===me,k=>{$('btns').innerHTML='';markPick(false);guestPick=false;NET.send({t:'choice',k})});break;
 case 'noprompt':guestPick=false;markPick(false);barL(0);$('btns').innerHTML='';break;
 case 'zoom':remoteZoom=true;zoomL(m.i);break;case 'zoomout':remoteZoom=false;zoomOutL();hideSceneL();break;
 case 'scene':sceneL(m.i,m.a);break;case 'police':policeL(m.i);break;
 case 'fx':fxL(m.txt,m.col);break;case 'flash':flashL(m.i);break;case 'snd':SND[m.n]&&SND[m.n]();break;
 case 'dice':diceL(m.x,m.y,m.cls);break;case 'dpop':dpopL();break;
 case 'card':cardL(m.k,m.i,m.pn);break;case 'deed':deedL(m.i,m.kind,m.pi,m.h);break;case 'car':carL(m.path,m.ti);break;case 'caridle':carIdleL(m.on,m.ti);break;
 case 'end':$('btns').innerHTML='<button onclick="location.reload()">Main lagi</button>';$('msg').textContent=m.s;break}}
function renderSetup(){
 document.querySelectorAll('#segM button').forEach(b=>b.classList.toggle('on',b.dataset.m===setupMode));
 $('netRow').style.display=setupMode==='local'?'none':'block';
 $('joinBox').style.display=setupMode==='join'&&!NET.joined?'block':'none';
 $('goBtn').style.display=setupMode==='join'?'none':'inline-block';
 const box=$('slotBox');
 if(setupMode==='join'){box.innerHTML=NET.lobby?'<p>Pemain di ruang:</p>'+NET.lobby.map((s,i)=>`<div class="slot"><span>${TOK[i]} Pemain ${i+1}${i===mySlot?' (kamu)':''}</span><b>${s.t==='human'?'Host':s.t==='net'?(s.f?'Teman ✅':'menunggu…'):s.t==='bot'?'Bot':'—'}</b></div>`).join(''):'';return}
 const opts=setupMode==='local'?[['human','Manusia'],['bot','Bot'],['none','Tidak ada']]:[['net','Teman (online)'],['bot','Bot'],['none','Tidak ada']];
 box.innerHTML=[0,1,2,3].map(i=>{const v=cfg[setupMode][i],filled=setupMode==='host'&&NET.links.some(l=>l.slot===i);
  if(setupMode==='host'&&i==0)return `<div class="slot"><span>${TOK[0]} Pemain 1</span><b>Kamu (host)</b></div>`;
  const o=opts.filter(x=>!(i<=1&&x[0]==='none'&&setupMode==='local')&&!(i==1&&x[0]==='none'&&false)).filter(x=>!(setupMode==='local'&&i==0&&x[0]==='none')).map(x=>`<option value="${x[0]}"${x[0]===v?' selected':''}>${x[1]}</option>`).join('');
  return `<div class="slot"><span>${TOK[i]} Pemain ${i+1}</span><span><select data-i="${i}"${filled?' disabled':''}>${o}</select>${filled?' ✅':''}</span></div>`}).join('');
 box.querySelectorAll('select').forEach(s=>s.onchange=()=>{cfg[setupMode][+s.dataset.i]=s.value;if(setupMode==='host')lobbyBroadcast();renderSetup()})}
function setMode(m){if(m===setupMode&&!(m==='join'&&NET.joined))return;closeNet();setupMode=m;NET.kind=$('kind').value;if(m==='host')openHost();else setInfo('');renderSetup()}
function start(){const list=[];
 if(setupMode==='join')return;
 if(setupMode==='local')cfg.local.forEach((t,i)=>{if(t!=='none')list.push({i,r:t==='bot'?'bot':'local'})});
 else cfg.host.forEach((t,i)=>{if(t==='none')return;if(i==0)list.push({i,r:'local'});else if(t==='bot')list.push({i,r:'bot'});else{const l=NET.links.find(x=>x.slot===i);list.push({i,r:l?'remote':'bot',l})}});
 if(list.length<2)return setInfo('Minimal 2 pemain.');
 P=list.map(x=>({n:TOK[x.i]+(x.i+1)+(x.r==='bot'?' Bot':x.r==='remote'?' 🌐':''),i:x.i,pos:0,cash:1500,jail:0,out:0,bot:x.r==='bot',r:x.r}));
 list.forEach((x,k)=>{if(x.l)x.l.pi=k});started=true;$('setup').style.display='none';
 if(setupMode==='host'){showRb();NET.links.forEach(l=>l.send({t:'start',you:l.pi}))}
 if(SFX.mus)SFX.onMusic();SND.go();play()}
$('segM').onclick=e=>{const b=e.target.closest('button');if(b)setMode(b.dataset.m)};
$('kind').onchange=()=>{NET.kind=$('kind').value;if(setupMode==='host'){closeNet();openHost()}renderSetup()};
$('goBtn').onclick=start;$('joinBtn').onclick=joinRoom;
addEventListener('pagehide',()=>{if(role==='guest'&&NET.send)try{NET.send({t:'bye'})}catch(e){}});
SFX.mount(document.querySelector('.top'));renderSetup();
{const h=location.hash.slice(1).toUpperCase();if(/^[A-Z]{4}(-T)?$/.test(h)){setupMode='join';$('kind').value=h.endsWith('-T')?'tab':'inet';$('ci').value=h.slice(0,4);renderSetup();setTimeout(joinRoom,300)}}

</script><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="3d.js"></script>

<script src="extras.js"></script>
</body></html>
